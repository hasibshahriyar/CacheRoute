name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cacheroute
          POSTGRES_PASSWORD: cacheroute
          POSTGRES_DB: cacheroute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cacheroute -d cacheroute"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        env:
          npm_config_onnxruntime_node_install_cuda: skip
        run: npm ci

      - name: Lint & Format Check
        run: npm run lint

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Integration Tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://cacheroute:cacheroute@localhost:5432/cacheroute
          REDIS_URL: redis://localhost:6379
          ADMIN_TOKEN: cr_admin_test_token
          SEMANTIC_THRESHOLD: '0.92'
          CACHE_TTL_SECONDS: '86400'
        run: npm run test:integration
