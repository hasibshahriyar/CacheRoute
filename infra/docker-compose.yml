services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cacheroute-postgres
    environment:
      POSTGRES_USER: cacheroute
      POSTGRES_PASSWORD: cacheroute
      POSTGRES_DB: cacheroute
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cacheroute -d cacheroute"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cacheroute-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  mock-llm:
    build:
      context: ..
      dockerfile: apps/mock-llm/Dockerfile
    container_name: cacheroute-mock-llm
    environment:
      PORT: "8081"
      PROVIDER_NAME: "mock-primary"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-llm-secondary:
    build:
      context: ..
      dockerfile: apps/mock-llm/Dockerfile
    container_name: cacheroute-mock-llm-secondary
    environment:
      PORT: "8082"
      PROVIDER_NAME: "mock-secondary"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8082/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: apps/gateway/Dockerfile
    container_name: cacheroute-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-llm:
        condition: service_healthy
      mock-llm-secondary:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://cacheroute:cacheroute@postgres:5432/cacheroute
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: cr_admin_dev_secret_token_change_in_prod
      MOCK_LLM_URL: http://mock-llm:8081
      MOCK_SECONDARY_LLM_URL: http://mock-llm-secondary:8082
      SEMANTIC_THRESHOLD: "0.92"
      CACHE_TTL_SECONDS: "86400"
      LOG_LEVEL: info
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: cacheroute-prometheus
    depends_on:
      - gateway
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: cacheroute-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"

volumes:
  pgdata:
